uk:
  emoji: ☎️
  name: Срібний телефон для катовицьких людей похилого віку
  address: Міський центр соціальної допомоги в Катовіце
  phones:
    - ''
  emails:
    - ''
  hours: 8:00 - 15:00
  payment: Безкоштовні інформаційні матеріали
  links:
    - type: website
      url: https://www.mops.katowice.pl/node/2936
      label: https://www.mops.katowice.pl/node/2936
  details:
    group_info:
      - нформаційна гаряча лінія для мешканців похилого віку Катовіц, за допомогою якої можна отримати відомості про можливості підтримки людей похилого віку та про програми, що реалізуються в місті.
      - Тут можна отримати відповіді як на питання щодо різних форм фінансової допомоги, так і нефінансової підтримки для осіб похилого віку.
      - Працівники «Срібного телефону» мають у своєму розпорядженні актуальні безкоштовні інформаційні матеріали, а також надають консультації й допомогу в індивідуальних справах людей похилого віку. За посередництвом «Срібного телефону» також приймаються звернення щодо дрібних домашніх ремонтів у межах програми «Золота Рука».
