  details:
    group_info:
      - Infolinia dla katowickich seniorów, za pośrednictwem której można uzyskać informacje na temat możliwości wsparcia osób starszych oraz realizowanych programów na terenie miasta.
      - Można tutaj uzyskać zarówno odpowiedzi na pytania dotyczące wszelkich form wsparcia finansowego, ale także niepieniężnego dla osób w wieku senioralnym.
      - Pracownicy Srebrnego Telefonu dysponują aktualnymi, nieodpłatnymi materiałami informacyjnymi oraz służą  poradą i pomocą w indywidualnych sprawach seniorów.  Poprzez Srebrny Telefon są przyjmowane również zgłoszenia dotyczące drobnych napraw domowych w ramach programu "Złota Rączka".
